name: Release

# Von Hand ausloesen (Actions -> Release -> Run workflow, Branch main).
# Liest die Version aus blueprint.name, nimmt die passende Sektion aus
# CHANGELOG.md als Release-Notes und legt Tag und GitHub-Release an.
# Bricht ab, wenn die Tests rot sind, der Tag schon existiert oder die
# Sektion fehlt - so kann kein Release ohne Changelog-Eintrag entstehen.
# "ersetzen" loescht ein vorhandenes Release samt Tag erst nach allen
# Pruefungen: fuer Nachtraege zu einer Version, die noch keiner importiert hat.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version wie in blueprint.name, z. B. V5.10.1 - erscheint als Name des Laufs und wird gegen das Repository geprueft"
        required: false
        type: string
      ersetzen:
        description: "Vorhandenes Release und Tag dieser Version loeschen und auf den aktuellen Stand neu anlegen"
        required: false
        type: boolean
        default: false

# Ohne run-name hiesse jeder Lauf nur "Release"; die Versionsnummer ist das,
# was man in der Liste sucht.
run-name: "Release ${{ inputs.version || '(Version aus blueprint.name)' }}"

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Version und Release-Notes aus dem Repository lesen
        id: v
        env:
          EINGABE: ${{ inputs.version }}
          ERSETZEN: ${{ inputs.ersetzen }}
        run: |
          version=$(sed -n '2p' PV-Ladesteuerung.yaml | grep -o 'V[0-9]*\.[0-9]*\.[0-9]*')
          test -n "$version" || { echo "Keine Version in blueprint.name"; exit 1; }
          if [ -n "$EINGABE" ] && [ "$EINGABE" != "$version" ]; then
            echo "Eingabe $EINGABE passt nicht zu blueprint.name ($version)"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            [ "$ERSETZEN" = "true" ] || { echo "Tag $version existiert bereits (Eingabe ersetzen setzt ihn neu)"; exit 1; }
            echo "Tag $version existiert und wird ersetzt"; echo "vorhanden=true" >> "$GITHUB_OUTPUT"
          fi
          awk -v v="$version" 'BEGIN{gsub(/\./,"\\.",v); re="^## \\[?" v "\\]?( |$)"} $0 ~ re {f=1; next} /^## / {f=0} f' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          test -s notes.md || { echo "CHANGELOG.md hat keine Sektion $version"; exit 1; }
          echo "Release-Checkliste (siehe CLAUDE.md, Abschnitt Versioning):"
          echo "  [x] Version in blueprint.name und bp_version: $version (pytest prueft die Gleichheit)"
          grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            && echo "  [x] CHANGELOG.md: Sektion '## [$version] - Datum' vorhanden" \
            || { echo "  [ ] CHANGELOG.md: Sektion muss '## [$version] - YYYY-MM-DD' heissen (Keep a Changelog); Kategorien als '### Added/Changed/Removed/Fixed'"; exit 1; }
          grep -q "^\[$version\]: https://github.com/" CHANGELOG.md \
            && echo "  [x] CHANGELOG.md: Link-Referenz [$version] vorhanden" \
            || { echo "  [ ] CHANGELOG.md: Link-Referenz '[$version]: .../compare/<vorher>...$version' fehlt, [Unreleased] auf $version...HEAD stellen"; exit 1; }
          echo "  [x] Merge nach main ist die Veroeffentlichung; danach: Blueprint an den Standorten neu importieren"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release $version:"; cat notes.md
      - name: Vorhandenes Release und Tag loeschen
        if: steps.v.outputs.vorhanden == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release delete "$VERSION" --cleanup-tag --yes \
            || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION"
      - name: Tag und Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --title "${{ steps.v.outputs.version }}" --notes-file notes.md
