name: Prüfungen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Erinnerung CHANGELOG (Sektion der Arbeitsversion mit Datum, Keep a Changelog)
        run: pytest -q tests/test_struktur.py -k changelog
